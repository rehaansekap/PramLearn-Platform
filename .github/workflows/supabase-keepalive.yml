name: Supabase Keep-Alive

on:
  schedule:
    # Berjalan otomatis setiap 2 hari sekali pada pukul 00:00 UTC (07:00 WIB)
    # Menjaga database Supabase Free Tier tetap aktif dan mencegah auto-pause (7 hari inaktivitas)
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Memungkinkan trigger manual via tombol "Run workflow" di GitHub Actions

jobs:
  keep-alive:
    name: Keep Supabase & Backend Active
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database & Auth API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY || secrets.SUPABASE_ANON_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          echo "============================================================"
          echo "🚀 MEMULAI PROSES KEEP-ALIVE SUPABASE & BACKEND"
          echo "============================================================"

          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            CLEAN_SUPABASE_URL="${SUPABASE_URL%/}"

            echo "1. Mengirim Query Nyata ke Tabel Supabase (${CLEAN_SUPABASE_URL}/rest/v1/pramlearnapp_role?select=id&limit=1) ..."
            TABLE_HTTP_CODE=$(curl -s -o table_res.txt -w "%{http_code}" \
              -X GET "${CLEAN_SUPABASE_URL}/rest/v1/pramlearnapp_role?select=id&limit=1" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}")
            echo "   Status Code Table Query: $TABLE_HTTP_CODE"

            echo "2. Mengirim Ping ke Auth Health (${CLEAN_SUPABASE_URL}/auth/v1/health) ..."
            AUTH_HTTP_CODE=$(curl -s -o auth_res.txt -w "%{http_code}" \
              -X GET "${CLEAN_SUPABASE_URL}/auth/v1/health" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}")
            echo "   Status Code Auth Health: $AUTH_HTTP_CODE"

            if [ "$TABLE_HTTP_CODE" -eq 200 ] || [ "$TABLE_HTTP_CODE" -eq 206 ] || [ "$AUTH_HTTP_CODE" -eq 200 ]; then
              echo "   ✅ SUKSES: Supabase berhasil di-query dan timer auto-pause berhasil di-reset!"
            else
              echo "   ⚠️ Supabase response warning (Table: $TABLE_HTTP_CODE, Auth: $AUTH_HTTP_CODE)"
              cat table_res.txt || true
            fi
          else
            echo "ℹ️ SUPABASE_URL atau SUPABASE_KEY belum diisi di GitHub Secrets (akan menggunakan ping backend jika tersedia)."
          fi

          if [ -n "$BACKEND_URL" ]; then
            CLEAN_BACKEND_URL="${BACKEND_URL%/}"
            echo "3. Mengirim Ping ke Backend Health API (${CLEAN_BACKEND_URL}/api/health/) ..."
            BACKEND_HTTP_CODE=$(curl -s -o backend_res.txt -w "%{http_code}" \
              -X GET "${CLEAN_BACKEND_URL}/api/health/")
            echo "   Status Code Backend Health: $BACKEND_HTTP_CODE"
            cat backend_res.txt || true
          fi

          echo "============================================================"
          echo "🎉 PROSES SELESAI"
          echo "============================================================"
