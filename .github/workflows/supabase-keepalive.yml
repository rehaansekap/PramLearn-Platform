name: Supabase Keep-Alive

on:
  schedule:
    # Berjalan otomatis setiap 3 hari sekali pada pukul 00:00 UTC (07:00 WIB)
    # Ini mencegah database Supabase Free Tier ter-pause/suspend setelah 7 hari tidak aktif
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Memungkinkan eksekusi manual via tombol "Run workflow" di GitHub Actions

jobs:
  ping-supabase:
    name: Keep Supabase Active
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API & Auth Service
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Mendukung SUPABASE_SERVICE_ROLE_KEY, SUPABASE_KEY, atau SUPABASE_ANON_KEY
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::SUPABASE_URL atau SUPABASE_SERVICE_ROLE_KEY belum diatur di GitHub Secrets."
            echo "Silakan pastikan SUPABASE_URL dan SUPABASE_SERVICE_ROLE_KEY sudah ditambahkan di GitHub Secrets."
            exit 1
          fi

          # Bersihkan trailing slash dari URL
          CLEAN_URL="${SUPABASE_URL%/}"

          echo "Mengirim ping ke Supabase REST API (${CLEAN_URL}/rest/v1/) ..."
          REST_RESPONSE=$(curl -s -o rest_response.txt -w "%{http_code}" \
            -X GET "${CLEAN_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")

          echo "REST API Status Code: $REST_RESPONSE"

          echo "Mengirim ping ke Supabase Auth Health (${CLEAN_URL}/auth/v1/health) ..."
          AUTH_RESPONSE=$(curl -s -o auth_response.txt -w "%{http_code}" \
            -X GET "${CLEAN_URL}/auth/v1/health" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")

          echo "Auth Health Status Code: $AUTH_RESPONSE"

          if [ "$REST_RESPONSE" -eq 200 ] || [ "$AUTH_RESPONSE" -eq 200 ]; then
            echo "============================================================"
            echo "✅ SUKSES: Supabase berhasil di-ping dengan status 200 OK!"
            echo "Aktivitas tercatat dan timer auto-pause (7 hari) telah di-reset."
            echo "============================================================"
          else
            echo "⚠️ Response REST: $REST_RESPONSE, Response Auth: $AUTH_RESPONSE"
            cat rest_response.txt
            exit 1
          fi
